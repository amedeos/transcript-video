[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcript-video"
version = "0.1.0"
description = "Transcribe and diarize video/audio with whisperX (faster-whisper + pyannote) and emit JSON, SRT, TXT, and human-readable Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Amedeo Salvati" }]
keywords = ["whisper", "whisperx", "faster-whisper", "pyannote", "diarization", "transcription", "subtitles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "whisperx>=3.1",
    "pyyaml>=6",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]
dev = [
    "ruff>=0.5",
    "pytest>=8",
]

[project.scripts]
transcript-from-video = "transcript_video.cli_from_video:main"
transcript-to-md = "transcript_video.cli_to_md:main"
transcript-learn = "transcript_video.cli_learn:main"
transcript-voices = "transcript_video.cli_voices:main"

[project.urls]
Homepage = "https://github.com/amedeos/transcript-video"
Reference = "https://github.com/amedeos/transcript-italian-video"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_video"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/transcript_video/cli_*.py" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require whisperX / torch / pyannote installed; skipped by default in CI (pass `-m integration` to run them locally).",
]
